name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and shared TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahaj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahaj_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sahaj_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sahaj_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Enable pgvector extension
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
      - run: pytest tests
        working-directory: apps/api

  infra:
    name: Infrastructure synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx cdk synth --strict -q
        env:
          CDK_DEFAULT_ACCOUNT: "359290219095"   # matches the committed cdk.context.json

  deploy:
    name: Deploy to AWS (blue/green)
    needs: [frontend, backend, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04-arm
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - run: npm ci
      - name: Deploy the API (ECS shifts traffic to the new task set and rolls back on failure)
        run: npx cdk deploy SahajApp --require-approval never --exclusively
      - name: Smoke test
        run: |
          url=$(aws cloudformation describe-stacks --stack-name SahajApp --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "$url/health"
